<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> <title>{% block title %}{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #95BBEE;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #95BBEE;
            padding: 10px 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            text-align: center;
            padding: 50px 20px;
        }
        main h1 {
            color: #95BBEE;
        }
        .cta-button {
            background-color: #95BBEE;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
            font-size: 16px;
        }
        .cta-button:hover {
            background-color: #95BBEE;
        }
        footer {
            background-color: #f1f1f1;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            color: #666;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/static">Главная</a>
        <a href="/about">О нас</a>
        <a href="#services">Услуги</a>
        <a href="/help_1">Поддержка</a>
        <a href="/we">Записаться на прием</a>
    </nav>





    <footer>
        <p>Контактные данные: +79066307928 | email@vetclinic.com</p>
        <p>Часы работы: Пн - Пт 8:00 - 20:00, Сб - Вс выходной </p>
    </footer>
{% block body %}{% endblock %}
</body>
</html>
